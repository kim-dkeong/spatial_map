[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_map"
version = "0.1.0"
description = "behavior log of VR maze + aligning image data + spatial map"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["spatial_map*"]
