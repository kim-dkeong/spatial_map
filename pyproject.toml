[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial_map"
version = "0.1.0"
description = "VR 미로 행동 로그 + imaging 데이터 정렬 및 spatial map 분석 도구"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["spatial_map*"]
